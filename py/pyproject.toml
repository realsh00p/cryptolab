[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab"
version = "0.1.0"
description = "The cryptolab Python application"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45",
  "gmpy2>=2.2",
]

[project.optional-dependencies]
dev = [
  "gmpy2-stubs>=2.2",
  "ruff>=0.11",
]

[project.scripts]
cryptolab-py = "cryptolab.main:main"

[tool.setuptools.package-data]
cryptolab = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "PERF",
  "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
